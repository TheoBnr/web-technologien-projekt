name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 25 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle Wrapper ausfuehrbar machen
        run: chmod +x ./gradlew

      - name: WatchlistService-Unit-Tests ausfuehren
        run: ./gradlew --no-daemon test --tests 'de.htwberlin.mywatchlist.service.WatchlistServiceTest'

      - name: Spring-Boot-Anwendung bauen
        run: ./gradlew --no-daemon bootJar
